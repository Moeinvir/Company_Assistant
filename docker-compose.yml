services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pyre}
      POSTGRES_DB: pyre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyre -d pyre"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pyre:${POSTGRES_PASSWORD:-pyre}@postgres:5432/pyre?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PROVIDER_KEYS_ENCRYPTION_SECRET: ${PROVIDER_KEYS_ENCRYPTION_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        VITE_PYRE_API_URL: ${VITE_PYRE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
